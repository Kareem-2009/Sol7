<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>إلى جيجي ❤️</title>

</head>


<body>

<!-- الصفحة الأساسية -->

<main id="main" class="page">

    <section class="card">

        <div class="heart">
            ❤️
        </div>


        <h1>
            جيجي
        </h1>


        <p class="subtitle">
            كان لازم أعمل حاجة مخصوص عشان أقولك الكلام ده.
        </p>


        <p class="message">

            انا اسف اني قعدت 4 شهور مش ببعت ولا بكلمك
            ❤️حقك عليا انا اسف يا جوجتي
            <br>
            <br>

            وحشتيني يا جيجي ❤️

        </p>


        <!-- أماكن الصور -->

        <div class="photos">

            <div class="photo">
                <img src="WhatsApp Image 2026-10-03 at 12.10.36 AM.jpeg" alt="صورة">
            </div>

            <div class="photo">
               <img src="WhatsApp Image 2026-10-03 at 12.10.37 AM.jpeg" alt="صورة">
            </div>

            <div class="photo">
               <img src="WhatsApp Image 2026-10-03 at 12.10.38 AM.jpeg" alt="صورة">
            </div>

        </div>


        <div class="question">
           صافيه لبن؟
        </div>


        <!-- الأزرار -->

        <div class="buttons" id="buttons">

            <button
                class="yes"
                onclick="forgive()">
                حليب يا قشطه ❤️
            </button>


            <button
                class="no"
                id="noBtn">
                لسه زعلانة 😤
            </button>

        </div>

    </section>

</main>



<!-- شاشة النهاية -->

<section id="final" class="final">

    <div class="final-card">

        <div class="heart">
            ❤️
        </div>

        <h2>
            وحشتيني يا جيجي
        </h2>

        <p>

           مش هتحصل تاني يعيوني

            <br>

           بحبك

        </p>

    </div>

</section>



<script src="script.js"></script>

</body>
</html>
